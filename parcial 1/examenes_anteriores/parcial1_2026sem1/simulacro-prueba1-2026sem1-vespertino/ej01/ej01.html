<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulacro Prueba 1 - Ej01</title>
    <link rel="stylesheet" href="ej01.css" />
  </head>

  <body>
    <h1>Menu Internacional</h1>
    <div class="primera fila">
      <button class="borde">
        <div class="comidaYbandera">
          <h2>Sushi</h2>
          <p class="bandera">🇯🇵</p>
        </div>
        <div class="emojiYdescripcion">
          <p class="emoji">🍣</p>
          <p class="descripcion">
            Arroz sazonado envuelto con la suavidad y el sabor del pescado
            crudo.
          </p>
        </div>
      </button>
      <button>
        <div class="comidaYbandera">
          <h2>Taco</h2>
          <p class="bandera">🇲🇽</p>
        </div>
        <div class="emojiYdescripcion">
          <p class="emoji">🌮</p>
          <p class="descripcion">
            Tortilla de maíz o trigo rellena de sabores vibrantes, carne o
            verduras, y coronada con salsas intensas.
          </p>
        </div>
      </button>
    </div>
    <div class="segunda fila">
      <button>
        <div class="comidaYbandera">
          <h2>Paella</h2>
          <p class="bandera">🇯🇵</p>
        </div>
        <div class="emojiYdescripcion">
          <p class="emoji">🥘</p>
          <p class="descripcion">
            Arroz cocinado en una paellera con el aroma de mariscos, verduras y
            el cálido toque del azafrán.
          </p>
        </div>
      </button>
      <button class="borde">
        <div class="comidaYbandera">
          <h2>Tallarines</h2>
          <p class="bandera">🇮🇹</p>
        </div>
        <div class="emojiYdescripcion">
          <p class="emoji">🍝</p>
          <p class="descripcion">
            Pasta cocida, cubierta por salsas ricas y un abrazo reconfortante de
            sabores italianos.
          </p>
        </div>
      </button>
    </div>
    <div class="tercera fila">
      <button class="borde">
        <div class="comidaYbandera">
          <h2>Fondue de queso</h2>
          <p class="bandera">🇨🇭</p>
        </div>
        <div class="emojiYdescripcion">
          <p class="emoji">🫕</p>
          <p class="descripcion">
            Queso cremoso y perfectamente derretido, servido en un ritual
            compartido para mojar y saborear.
          </p>
        </div>
      </button>
      <button>
        <div class="comidaYbandera">
          <h2>Hamburguesa</h2>
          <p class="bandera">🇺🇸</p>
        </div>
        <div class="emojiYdescripcion">
          <p class="emoji">🍔</p>
          <p class="descripcion">
            Jugoso medallón de carne entre pan suave, coronado con queso fundido
            y la frescura de los toppings.
          </p>
        </div>
      </button>
    </div>
  </body>
</html>
